name: TestProof

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  testproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Grade test strength
        run: |
          uv run testproof grade \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --test-cmd "uv run pytest -q" \
            --threshold 80 \
            --format json \
            --output testproof.json
      - name: Render markdown
        if: always()
        run: uv run testproof report --input testproof.json --format markdown --output testproof.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testproof-report
          path: |
            testproof.json
            testproof.md
