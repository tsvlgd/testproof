[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testproof"
version = "0.1.0"
description = "Grade whether a test suite catches bugs, then verify the tests that close the gap."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TestProof contributors" }]
keywords = ["mutation-testing", "testing", "ai", "ci", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
testproof = "testproof.cli:app"

[dependency-groups]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["testproof"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
